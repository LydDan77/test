<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Girls' Christmas Lists</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a red hero band with twinkling lights and a snowdrift edge, then one chunky gift-box card per girl. Snow falls behind everything. */
:root {
  color-scheme: light;
  --bg: #f2f9f6;
  --surface: #ffffff;
  --ink: #1d2b26;
  --muted: #5d6f68;
  --line: #dce8e2;
  --hero: #c41f3b;
  --hero-deep: #a31630;
  --on-hero: #ffffff;
  --pine: #1c7a50;
  --pine-soft: #e3f4ea;
  --c-aria: #d6336c;
  --c-ella: #1c7a50;
  --c-eyesie: #c2820c;
  --flake: #a9cfe3;
  --font-display: "Mountains of Christmas", "Comic Sans MS", cursive;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0c1c1a; --surface: #14302a; --ink: #eef6f1; --muted: #a3bab0; --line: #24463c;
    --hero: #8d1630; --hero-deep: #6f0f24;
    --pine: #6fd3a2; --pine-soft: #1b3d32;
    --c-aria: #ff86ac; --c-ella: #6fd3a2; --c-eyesie: #f2c04e;
    --flake: #ffffff;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.45; }
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

.hero {
  position: relative; z-index: 1;
  background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.12) 0 2px, transparent 3px) 0 0 / 46px 46px,
              radial-gradient(circle at 70% 75%, rgba(255,255,255,.1) 0 3px, transparent 4px) 0 0 / 62px 62px,
              linear-gradient(var(--hero), var(--hero-deep));
  color: var(--on-hero);
  text-align: center;
  padding: 0 16px 3.25rem;
}
.hero::after { /* snowdrift edge */
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 26px;
  background: radial-gradient(ellipse at 50% 100%, var(--bg) 69%, transparent 71%) 0 0 / 64px 26px repeat-x;
}
.lights { height: 34px; position: relative; border-top: 3px solid rgba(0,0,0,.35); }
.lights::before, .lights::after {
  content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 22px;
  animation: twinkle 1.6s ease-in-out infinite alternate;
}
.lights::before {
  background: radial-gradient(ellipse 7px 10px at 20px 10px, #ffd94a 95%, transparent) 0 0 / 120px 22px,
              radial-gradient(ellipse 7px 10px at 80px 10px, #7be08f 95%, transparent) 0 0 / 120px 22px;
  filter: drop-shadow(0 0 6px #ffe98a);
}
.lights::after {
  background: radial-gradient(ellipse 7px 10px at 50px 10px, #6ecbff 95%, transparent) 0 0 / 120px 22px,
              radial-gradient(ellipse 7px 10px at 110px 10px, #ff9ad1 95%, transparent) 0 0 / 120px 22px;
  filter: drop-shadow(0 0 6px #bfe8ff);
  animation-delay: -1.6s; animation-direction: alternate-reverse;
}
@keyframes twinkle { from { opacity: 1; } to { opacity: .35; } }
.hero h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.6rem, 10vw, 4.75rem); line-height: 1; margin: 1rem 0 0;
  text-shadow: 0 3px 0 rgba(0,0,0,.2); text-wrap: balance;
}
.hero p { margin: .6rem auto 0; max-width: 30rem; font-weight: 600; opacity: .95; }
.tally { margin-top: 1.1rem; display: flex; flex-direction: column; align-items: center; gap: .7rem; }
.tally strong {
  background: #fff; color: #a31630; font-weight: 800; font-size: 1.05rem;
  padding: .45rem 1.1rem; border-radius: 999px; box-shadow: 0 4px 0 rgba(0,0,0,.2);
  font-variant-numeric: tabular-nums;
}
.switch { display: inline-flex; align-items: center; gap: .5rem; font-weight: 700; cursor: pointer; }
.switch input { width: 1.2rem; height: 1.2rem; accent-color: #1c7a50; }

.page { position: relative; z-index: 1; max-width: 70rem; margin: 0 auto; padding: 1.75rem 16px 3rem; display: flex; flex-direction: column; gap: 1.5rem; }
.notice { background: var(--surface); border: 2px dashed var(--hero); border-radius: 1rem; padding: .75rem 1rem; font-weight: 700; }

.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(17.5rem, 1fr)); gap: 2rem 1.5rem; align-items: start; }
.kid {
  min-width: 0; display: flex; flex-direction: column; gap: .8rem;
  background: var(--surface); border: 3px solid var(--kid); border-radius: 1.6rem;
  padding: 1.1rem 1rem 1rem; box-shadow: 0 7px 0 var(--kid);
  position: relative;
}
.kid[data-kid="aria"] { --kid: var(--c-aria); --face: "\2B50"; }
.kid[data-kid="ella"] { --kid: var(--c-ella); --face: "\1F430"; }
.kid[data-kid="eyesie"] { --kid: var(--c-eyesie); --face: "\1F436"; }
.kid::before { /* bow on top of the box */
  content: "\1F380"; position: absolute; top: -1.35rem; left: 50%; transform: translateX(-50%);
  font-size: 2rem; line-height: 1;
}
.kid-head { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.kid-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1; margin: 0; color: var(--kid); }
.kid-head h2::before { content: var(--face); margin-right: .4rem; font-size: 1.7rem; }
.count { color: var(--muted); font-size: .9rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.kid-head:has(.count:empty) + .bar { display: none; }
.bar i {
  display: block; height: 100%; width: 0; border-radius: 999px; transition: width .4s ease;
  background: repeating-linear-gradient(-45deg, var(--kid) 0 8px, #fff 8px 16px);
}

.gifts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
.gift {
  width: 100%; display: flex; align-items: center; gap: .7rem;
  padding: .6rem .8rem; background: var(--bg); border: 2px solid transparent; border-radius: 1rem;
  color: inherit; font: inherit; font-weight: 600; text-align: left; cursor: pointer;
  transition: transform .12s ease, border-color .12s ease;
}
.gift:hover { border-color: var(--kid); transform: translateY(-1px); }
.gift:focus-visible, .add input:focus-visible, .add button:focus-visible, .golink:focus-visible, .switch input:focus-visible { outline: 3px solid var(--kid, #fff); outline-offset: 2px; }
.box {
  flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%;
  border: 2.5px solid var(--kid); background: var(--surface);
  display: grid; place-items: center; color: #fff; font-size: .95rem; font-weight: 800; line-height: 1;
}
.name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.status { flex: none; font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--pine); }
.status::before { content: "\1F381  "; }
.gift[aria-pressed="true"] { background: var(--pine-soft); }
.gift[aria-pressed="true"] .box { background: var(--pine); border-color: var(--pine); }
.gift.pop .box { animation: pop .3s ease; }
.gift[aria-pressed="true"] .name { color: var(--muted); text-decoration: line-through; }
.gift.saving { opacity: .6; }
@keyframes pop { 0% { transform: scale(.5); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
.empty { padding: .8rem; color: var(--muted); font-weight: 700; text-align: center; }

.golink {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  padding: .9rem 1rem; border-radius: 1rem; background: var(--kid); color: #fff;
  text-decoration: none; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark) { .golink { color: #1d1016; } }
.golink small { display: block; font-weight: 600; font-size: .85rem; opacity: .9; }
.golink b { font-size: 1.3rem; }

.add { display: flex; gap: .5rem; }
.add input {
  flex: 1; min-width: 0; padding: .55rem .9rem; font: inherit; color: var(--ink);
  background: var(--surface); border: 2px dashed var(--line); border-radius: 999px;
}
.add button {
  flex: none; padding: .55rem 1.1rem; font: inherit; font-weight: 800; cursor: pointer;
  color: var(--surface); background: var(--kid); border: 0; border-radius: 999px;
}
.countdown { margin-top: .9rem !important; font-family: var(--font-display); font-size: 1.6rem; font-weight: 700 !important; }
.tools {
  background: var(--surface); border: 2px dashed var(--hero); border-radius: 1.4rem; padding: 1rem;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .9rem 1rem; align-items: end;
  margin-bottom: 1rem;
}
.field { display: flex; flex-direction: column; gap: .3rem; font-weight: 800; font-size: .9rem; min-width: 0; }
.field input {
  padding: .55rem .9rem; font: inherit; font-weight: 600; color: var(--ink); min-width: 0;
  background: var(--bg); border: 2px solid var(--line); border-radius: 999px;
}
.field input:focus-visible, .tool-btns button:focus-visible, .shop:focus-visible, .rm:focus-visible { outline: 3px solid var(--hero); outline-offset: 2px; }
.tool-btns { display: flex; flex-wrap: wrap; gap: .5rem; }
.tool-btns button {
  flex: 1 1 auto; padding: .6rem 1rem; font: inherit; font-weight: 800; cursor: pointer; white-space: nowrap;
  color: #fff; background: var(--hero); border: 0; border-radius: 999px; box-shadow: 0 4px 0 var(--hero-deep);
}
.tool-btns button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--hero-deep); }
.row { display: flex; align-items: stretch; gap: .35rem; }
.row .gift { flex: 1; min-width: 0; }
.shop, .rm {
  flex: none; display: grid; place-items: center; padding: 0 .7rem; border-radius: 1rem;
  background: var(--bg); border: 2px solid transparent; color: var(--kid); font: inherit; font-size: .8rem; font-weight: 800;
  text-decoration: none; cursor: pointer; white-space: nowrap;
}
.shop:hover, .rm:hover { border-color: var(--kid); }
.picked .gift { border-color: var(--kid); animation: wiggle .5s ease 3; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-1.5deg); } 75% { transform: rotate(1.5deg); } }
.fx { position: fixed; z-index: 5; pointer-events: none; font-size: 1.4rem; }
@media (prefers-reduced-motion: reduce) { .picked .gift { animation: none; } }
.gift.taken { cursor: not-allowed; opacity: .75; }
.gift.taken:hover { border-color: transparent; transform: none; }
.gift.taken .status::before { content: "\1F512  "; }
.org { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; align-items: center; }
.org button, .org input { font: inherit; font-weight: 700; padding: .4rem .9rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.org button { cursor: pointer; }
.org button:focus-visible, .org input:focus-visible { outline: 3px solid var(--hero); outline-offset: 2px; }
dialog.ask {
  border: 3px solid var(--hero); border-radius: 1.6rem; padding: 1.4rem 1.25rem 1.1rem; max-width: min(24rem, calc(100vw - 32px));
  background: var(--surface); color: var(--ink); text-align: center; box-shadow: 0 8px 0 var(--hero-deep);
}
dialog.ask::backdrop { background: rgba(10, 20, 18, .6); }
dialog.ask h2 { font-family: var(--font-display); font-size: 2rem; line-height: 1.05; margin: 0 0 .4rem; color: var(--hero); }
@media (prefers-color-scheme: dark) { dialog.ask h2 { color: #ff8fa3; } }
dialog.ask .what { font-weight: 800; font-size: 1.1rem; margin: 0 0 .5rem; overflow-wrap: anywhere; }
dialog.ask p { margin: 0 0 1rem; color: var(--muted); font-weight: 600; }
dialog.ask .btns { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }
dialog.ask button { font: inherit; font-weight: 800; padding: .65rem 1.2rem; border-radius: 999px; cursor: pointer; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
dialog.ask button.yes { background: var(--pine); border-color: var(--pine); color: var(--surface); }
dialog.ask button:focus-visible { outline: 3px solid var(--hero); outline-offset: 2px; }
.foot { text-align: center; color: var(--muted); font-weight: 700; }
@media (prefers-reduced-motion: reduce) {
  .lights::before, .lights::after, .gift.pop .box { animation: none; }
  .bar i, .gift { transition: none; }
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<header class="hero">
  <div class="lights" aria-hidden="true"></div>
  <h1>🎄 Girls' Christmas Lists 🎄</h1>
  <p>Tap a gift to claim it. Once you confirm, it's locked in so nobody else can pick it or change it.</p>
  <p class="countdown" id="countdown"></p>
  <div class="tally">
    <strong id="tally">Loading the lists…</strong>
    <label class="switch" for="hide-bought"><input type="checkbox" id="hide-bought"> Show only what's still needed</label>
  </div>
</header>
<div class="page">
  <div class="notice" id="notice" hidden></div>
  <section class="tools" aria-label="Tools">
    <label class="field" for="search"><span>🔎 Find a gift</span><input id="search" type="search" placeholder="Search all the lists"></label>
    <div class="tool-btns">
      <button type="button" id="pick">🎲 Pick one for me</button>
      <button type="button" id="share">🔗 Copy link</button>
    </div>
  </section>
  <main class="lists" id="lists"></main>
  <div class="org">
    <button type="button" id="org-toggle">Organizer</button>
    <form id="org-form" class="org" hidden>
      <input id="org-code" type="password" autocomplete="off" placeholder="Organizer code" aria-label="Organizer code">
      <button type="submit">Unlock</button>
    </form>
    <span id="org-on" hidden>Organizer mode is on. You can undo any claim and remove added gifts. <button type="button" id="org-off">Turn off</button></span>
  </div>
  <p class="foot">Made with love for Aria, Ella &amp; Eyesie ❄️</p>
</div>
<dialog class="ask" id="ask" aria-labelledby="ask-title">
  <h2 id="ask-title"></h2>
  <div class="what" id="ask-what"></div>
  <p id="ask-text"></p>
  <div class="btns">
    <button type="button" id="ask-no"></button>
    <button type="button" class="yes" id="ask-yes"></button>
  </div>
</dialog>
<script>
(function () {
  var KIDS = [
    { id: "aria", name: "Aria", link: "https://gowish.com/s/e00459" },
    { id: "ella", name: "Ella" },
    { id: "eyesie", name: "Eyesie" }
  ];
  var gifts = [];
  var loaded = false;
  var saving = {};
  var hideBought = false, query = "", picked = null, confirmRm = null, popId = null;
  try { hideBought = localStorage.getItem("hideBought") === "1"; localStorage.removeItem("buyer"); } catch (e) {}

  document.getElementById("search").addEventListener("input", function (e) {
    query = e.target.value.trim().toLowerCase(); render();
  });
  document.getElementById("pick").addEventListener("click", function () {
    var open = gifts.filter(function (g) { return !g.purchased; });
    if (!open.length) { notice(loaded ? "Everything is already claimed!" : "The lists are still loading."); return; }
    picked = open[Math.floor(Math.random() * open.length)].id;
    query = ""; document.getElementById("search").value = "";
    render();
    var row = $lists.querySelector('[data-gift="' + picked + '"]');
    if (row) { row.scrollIntoView({ block: "center", behavior: "smooth" }); row.focus({ preventScroll: true }); }
  });
  document.getElementById("share").addEventListener("click", function (e) {
    var b = e.currentTarget, url = location.origin + "/";
    function done(ok) { notice(ok ? "" : "Copy this link to share: " + url); if (ok) { b.textContent = "\u2705 Link copied!"; setTimeout(function () { b.textContent = "\uD83D\uDD17 Copy link"; }, 2000); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { done(true); }, function () { done(false); });
    else done(false);
  });

  (function countdown() {
    var now = new Date(), y = now.getFullYear();
    var today = new Date(y, now.getMonth(), now.getDate());
    var xmas = new Date(y, 11, 25);
    if (today > xmas) xmas = new Date(y + 1, 11, 25);
    var days = Math.round((xmas - today) / 86400000);
    document.getElementById("countdown").textContent =
      days === 0 ? "\uD83C\uDF85 Merry Christmas!" : days + (days === 1 ? " sleep" : " sleeps") + " until Christmas";
  })();

  function burst(x, y) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !document.body.animate) return;
    var bits = ["\uD83C\uDF81", "\u2B50", "\u2744\uFE0F", "\uD83C\uDF84", "\uD83C\uDF80", "\u2728"];
    for (var i = 0; i < 14; i++) {
      var s = el("span", "fx", bits[i % bits.length]);
      s.style.left = x + "px"; s.style.top = y + "px";
      document.body.appendChild(s);
      var ang = Math.random() * 6.28, dist = 60 + Math.random() * 90;
      s.animate([
        { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
        { transform: "translate(" + (Math.cos(ang) * dist - 12) + "px," + (Math.sin(ang) * dist + 40) + "px) scale(1.1) rotate(" + (Math.random() * 240 - 120) + "deg)", opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = (function (n) { return function () { n.remove(); }; })(s);
    }
  }
  function shopUrl(name) {
    return "https://www.amazon.com/s?k=" + encodeURIComponent(name.replace(/eyesie-sized/i, "kid-sized"));
  }

  var $lists = document.getElementById("lists");
  var $tally = document.getElementById("tally");
  var $notice = document.getElementById("notice");
  var $hide = document.getElementById("hide-bought");
  $hide.checked = hideBought;
  $hide.addEventListener("change", function () {
    hideBought = $hide.checked;
    try { localStorage.setItem("hideBought", hideBought ? "1" : "0"); } catch (e) {}
    render();
  });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function notice(msg) { $notice.textContent = msg || ""; $notice.hidden = !msg; }

  // A random key kept on this device proves which claims are yours.
  var device = "", orgCode = "", organizer = false;
  try { device = localStorage.getItem("device") || ""; orgCode = localStorage.getItem("orgCode") || ""; } catch (e) {}
  if (!/^[a-f0-9]{32}$/.test(device)) {
    var bytes = new Uint8Array(16); crypto.getRandomValues(bytes);
    device = Array.prototype.map.call(bytes, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    try { localStorage.setItem("device", device); } catch (e) {}
  }

  function api(body) {
    var headers = { "X-Device": device };
    if (orgCode) headers["X-Organizer"] = orgCode;
    if (body) headers["Content-Type"] = "application/json";
    return fetch("/api/gifts", body ? { method: "POST", headers: headers, body: JSON.stringify(body) }
                                    : { cache: "no-store", headers: headers }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) { var err = new Error(d.error || "HTTP " + r.status); err.data = d; throw err; }
        return d;
      }, function () { throw new Error("HTTP " + r.status); });
    });
  }
  function setState(data) {
    gifts = data.gifts || []; loaded = true; organizer = !!data.organizer;
    document.getElementById("org-on").hidden = !organizer;
    document.getElementById("org-toggle").hidden = organizer;
    if (organizer) document.getElementById("org-form").hidden = true;
  }
  function apply(data) { setState(data); notice(""); render(); }

  document.getElementById("org-toggle").addEventListener("click", function () {
    var f = document.getElementById("org-form"); f.hidden = !f.hidden;
    if (!f.hidden) document.getElementById("org-code").focus();
  });
  document.getElementById("org-form").addEventListener("submit", function (e) {
    e.preventDefault();
    orgCode = document.getElementById("org-code").value.trim();
    api().then(function (d) {
      apply(d);
      if (d.organizer) { try { localStorage.setItem("orgCode", orgCode); } catch (e2) {} document.getElementById("org-code").value = ""; }
      else { orgCode = ""; notice("That organizer code isn't right."); }
    }, function (e2) { notice(e2.message); });
  });
  document.getElementById("org-off").addEventListener("click", function () {
    orgCode = ""; try { localStorage.removeItem("orgCode"); } catch (e) {}
    refresh();
  });
  function refresh() {
    if (Object.keys(saving).length) return;
    api().then(apply, function () {
      if (!loaded) $tally.textContent = "Can't reach the lists yet. Still trying…";
    });
  }
  function failed(e) {
    if (e && e.data && e.data.gifts) { setState(e.data); render(); }
    notice(e && e.data && e.data.error ? e.data.error : "That didn't save. Check your connection and try again.");
  }

  var parts = {};
  KIDS.forEach(function (kid) {
    var sec = el("section", "kid");
    sec.dataset.kid = kid.id;
    var head = el("div", "kid-head");
    head.appendChild(el("h2", null, kid.name));
    var count = el("span", "count", "");
    head.appendChild(count);
    sec.appendChild(head);
    var bar = el("div", "bar"); var fill = el("i"); bar.appendChild(fill); sec.appendChild(bar);

    if (kid.link) {
      var a = el("a", "golink");
      a.href = kid.link; a.target = "_blank"; a.rel = "noopener";
      var t = el("span", null, "Open " + kid.name + "'s list on GoWish");
      t.appendChild(el("small", null, "Her wishes live there. Reserve gifts on GoWish."));
      a.appendChild(t); a.appendChild(el("b", null, "↗"));
      sec.appendChild(a);
    }

    var ul = el("ul", "gifts");
    sec.appendChild(ul);

    var form = el("form", "add");
    var input = el("input");
    input.id = "add-" + kid.id; input.type = "text"; input.maxLength = 80;
    input.placeholder = "Add a gift for " + kid.name;
    input.setAttribute("aria-label", "Add a gift for " + kid.name);
    var btn = el("button", null, "Add"); btn.type = "submit";
    form.appendChild(input); form.appendChild(btn);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var name = input.value.trim();
      if (!name) return;
      btn.disabled = true;
      api({ action: "add", kid: kid.id, name: name })
        .then(function (d) { input.value = ""; apply(d); }, failed)
        .then(function () { btn.disabled = false; });
    });
    sec.appendChild(form);

    $lists.appendChild(sec);
    parts[kid.id] = { ul: ul, count: count, fill: fill, form: form, hasLink: !!kid.link };
  });

  // Every claim and every release goes through this confirmation pop-up.
  var $ask = document.getElementById("ask"), askDone = null;
  function ask(title, what, text, yes, no) {
    document.getElementById("ask-title").textContent = title;
    document.getElementById("ask-what").textContent = what;
    document.getElementById("ask-text").textContent = text;
    document.getElementById("ask-yes").textContent = yes;
    document.getElementById("ask-no").textContent = no;
    return new Promise(function (resolve) {
      askDone = resolve;
      if ($ask.showModal) { $ask.showModal(); document.getElementById("ask-no").focus(); }
      else { askDone = null; resolve(window.confirm(title + "\n" + what + "\n\n" + text)); }
    });
  }
  function answer(ok) { var f = askDone; askDone = null; if ($ask.open) $ask.close(); if (f) f(ok); }
  document.getElementById("ask-yes").addEventListener("click", function () { answer(true); });
  document.getElementById("ask-no").addEventListener("click", function () { answer(false); });
  $ask.addEventListener("close", function () { answer(false); });
  $ask.addEventListener("click", function (e) { if (e.target === $ask) answer(false); });

  function toggle(g, ev) {
    if (saving[g.id] || askDone) return;
    if (g.purchased && !g.canUndo) { notice("That one is already claimed and locked in. Pick another gift!"); return; }
    var x = ev && ev.clientX, y = ev && ev.clientY;
    var q = g.purchased
      ? ask("Give up this gift?", g.name, organizer && !g.mine ? "This releases someone else's claim so the gift is open for anyone again." : "It goes back on the list for someone else to claim.", "Yes, release it", "Keep it claimed")
      : ask("Claim this gift?", g.name, "Once you claim it, it's locked in. Nobody else can pick it or undo it.", "Yes, claim it \uD83C\uDF81", "Not yet");
    q.then(function (ok) { if (ok) commit(g, { clientX: x, clientY: y }); });
  }
  function commit(g, ev) {
    if (saving[g.id]) return;
    saving[g.id] = true;
    var want = !g.purchased;
    g.purchased = want; g.mine = want; g.canUndo = want; picked = null;
    popId = want ? g.id : null; render();
    setTimeout(function () { popId = null; }, 350);
    if (want && ev) burst(ev.clientX || innerWidth / 2, ev.clientY || innerHeight / 2);
    api({ action: "set", id: g.id, purchased: want })
      .then(function (d) { delete saving[g.id]; apply(d); },
            function (e) { delete saving[g.id]; g.purchased = !want; failed(e); render(); });
  }

  function render() {
    var focusId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.gift : null;
    var total = 0, bought = 0;
    KIDS.forEach(function (kid) {
      var p = parts[kid.id];
      var mine = gifts.filter(function (g) { return g.kid === kid.id; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      var done = mine.filter(function (g) { return g.purchased; }).length;
      total += mine.length; bought += done;
      p.count.textContent = mine.length ? done + " of " + mine.length + " claimed" : "";
      p.fill.style.width = mine.length ? (100 * done / mine.length) + "%" : "0";
      p.form.hidden = !loaded;

      var shown = mine.filter(function (g) {
        return !(hideBought && g.purchased) && (!query || g.name.toLowerCase().indexOf(query) !== -1);
      });
      p.ul.textContent = "";
      p.ul.hidden = false;
      if (!shown.length) {
        if (p.hasLink && !mine.length) { p.ul.hidden = true; return; }
        var msg = !loaded ? "Loading…" : !mine.length ? "No gifts listed yet." : query ? "No matches here." : "Everything here is claimed.";
        var li0 = el("li"); li0.appendChild(el("div", "empty", msg)); p.ul.appendChild(li0);
        return;
      }
      shown.forEach(function (g) {
        var li = el("li", "row" + (picked === g.id ? " picked" : ""));
        var b = el("button", "gift" + (saving[g.id] ? " saving" : "") + (popId === g.id ? " pop" : "") + (g.purchased && !g.canUndo ? " taken" : ""));
        if (g.purchased && !g.canUndo) b.setAttribute("aria-disabled", "true");
        b.type = "button";
        b.dataset.gift = g.id;
        b.setAttribute("aria-pressed", g.purchased ? "true" : "false");
        b.appendChild(el("span", "box", g.purchased ? "✓" : ""));
        b.appendChild(el("span", "name", g.name));
        if (g.purchased) b.appendChild(el("span", "status", "Claimed" + (g.mine ? " by you" : "")));
        b.addEventListener("click", function (ev) { toggle(g, ev); });
        li.appendChild(b);
        if (!g.purchased) {
          var s = el("a", "shop", "Shop \u2197");
          s.href = shopUrl(g.name); s.target = "_blank"; s.rel = "noopener";
          s.setAttribute("aria-label", "Shop for " + g.name);
          li.appendChild(s);
        }
        if (g.canRemove) {
          var asking = confirmRm === g.id;
          var r = el("button", "rm", asking ? "Remove?" : "\u2715");
          r.type = "button";
          r.setAttribute("aria-label", asking ? "Confirm removing " + g.name : "Remove " + g.name);
          r.addEventListener("click", function () {
            if (confirmRm !== g.id) { confirmRm = g.id; render(); return; }
            confirmRm = null;
            api({ action: "remove", id: g.id }).then(apply, failed);
          });
          li.appendChild(r);
        }
        p.ul.appendChild(li);
      });
    });
    if (loaded) $tally.textContent = total ? bought + " of " + total + " gifts claimed" : "No gifts listed yet";
    if (focusId) {
      var again = $lists.querySelector('[data-gift="' + focusId + '"]');
      if (again) again.focus();
    }
  }
  render();
  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 10000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
})();
</script>
<script>
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c = document.getElementById("snow"), x = c.getContext("2d"), flakes = [], w, h;
  function size() { w = c.width = innerWidth; h = c.height = innerHeight; }
  size(); addEventListener("resize", size);
  for (var i = 0; i < 70; i++) flakes.push({ x: Math.random(), y: Math.random(), r: 1.5 + Math.random() * 3, s: .0006 + Math.random() * .0012, d: Math.random() * 6.28 });
  function tick(t) {
    x.clearRect(0, 0, w, h);
    x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--flake") || "#fff";
    x.globalAlpha = .8;
    flakes.forEach(function (f) {
      f.y += f.s; if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
      x.beginPath(); x.arc(f.x * w + Math.sin(t / 1400 + f.d) * 14, f.y * h, f.r, 0, 6.28); x.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
